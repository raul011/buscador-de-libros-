name: CI / CD Despliegue proyecto integrador

# Se ejecuta en cada push a main
on:
  push:
    branches: [main]
  # También se puede lanzar manualmente desde GitHub
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Tests + Lint
  # ─────────────────────────────────────────────
  test:
    name: Tests y Lint
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: proyecto-react/package-lock.json

      - name: Instalar dependencias
        working-directory: proyecto-react
        run: npm ci

      - name: Correr linter (oxlint)
        working-directory: proyecto-react
        run: npm run lint

      - name: Correr tests (Vitest)
        working-directory: proyecto-react
        run: npm test

  # ─────────────────────────────────────────────
  # JOB 2: Build + Deploy FTP
  # Solo corre si el job de tests pasó
  # ─────────────────────────────────────────────
  deploy:
    name: Build y Deploy a Tecnoweb
    runs-on: ubuntu-latest
    needs: test  # espera que pasen los tests

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: proyecto-react/package-lock.json

      - name: Instalar dependencias
        working-directory: proyecto-react
        run: npm ci

      - name: Generar build de producción
        working-directory: proyecto-react
        run: npm run build
        # El base '/inf240/grupo04sx/' ya está en vite.config.js

      - name: Deploy por FTP a Tecnoweb
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          # Sube el contenido de dist/ al subdirectorio del grupo
          local-dir: ./proyecto-react/dist/
          server-dir: /inf240/grupo04sx/
          # Borra archivos viejos del servidor que ya no existen en dist/
          dangerous-clean-slate: false
